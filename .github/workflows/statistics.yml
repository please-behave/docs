name: Statistics
on:
  push:
    branches: [main]
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: 'false' # Install tools explicitly before running tasks.

jobs:
  collect:
    name: Collect statistics
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: aqua:boyter/scc
      - name: Write lines of documentation metric
        run: |
          mkdir -p target/statistics
          scc --format json --include-ext md,html . >target/scc.json
          jq '{id: "loc", label: "LOC", value: (map(.Code) | add), kind: "loc", badge: true}' target/scc.json >target/statistics/loc.json
      - name: Upload statistics metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statistics-metrics
          path: target/statistics
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish statistics
    needs:
      - collect
    if: github.ref == 'refs/heads/main'
    uses: christianpflugradt/please-behave-governance/.github/workflows/statistics-publish.yml@19e626fc8f927a8d909d6d7c11761096294b22c0 # updates/workflows/statistics
    with:
      project: please-behave-docs
    secrets:
      STATISTICS_TOKEN: ${{ secrets.STATISTICS_TOKEN }}
