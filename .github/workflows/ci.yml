name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    permissions:
      contents: read
      id-token: write
    uses: christianpflugradt/repository-catalog/.github/workflows/ci-check.yml@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/workflows/ci
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
  example-setup:
    name: Test the Docker Compose example
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          experimental: true
          version: 2026.11.11
      - name: Pull pinned example images
        run: docker compose -f compose/compose.yaml --profile collector pull
      - name: Run the offline integration test
        run: mise run test-example
  rule-examples:
    name: Test the example rules
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          experimental: true
          version: 2026.11.11
      - name: Run the offline example test
        run: mise run test-rule-examples
