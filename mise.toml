include = [
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/repository-conventions/mise.toml?ref=2b098709773d0de78f6d03b597c03b15eff6e2d5",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/security/mise.toml?ref=2b098709773d0de78f6d03b597c03b15eff6e2d5",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/open-source-software/mise.toml?ref=2b098709773d0de78f6d03b597c03b15eff6e2d5",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/why/mise.toml?ref=2b098709773d0de78f6d03b597c03b15eff6e2d5",
]

[tools]
"github:please-behave/cli" = "0.22.0"
python = "3.15.2"
"aqua:lycheeverse/lychee" = "0.24.2"
"github:rust-lang/mdBook" = "0.5.4"

[tasks.format]
description = "Format the repository's shell scripts"
run = "shfmt -w scripts tests"

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.setup]
description = "Fetch dependencies for CI and offline Git hooks (the repository has none yet)"
run = "true"

[tasks.build]
description = "Build the documentation and check internal links"
run = "sh scripts/build.sh"

[tasks.test-links]
description = "Prove that broken internal links fail the documentation build"
run = "sh tests/broken-link.sh"

[tasks.test-example]
description = "Test the Docker Compose example with cached images"
run = "sh tests/example-setup.sh"

[tasks.test-rule-examples]
description = "Validate the example rules and run the dummy adapter with the pinned CLI"
run = "sh tests/rule-examples.sh"
