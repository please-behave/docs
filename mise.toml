include = [
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/repository-conventions/mise.toml?ref=29b8b072e41158ab12cadafbda35e868642b224e",
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/security/mise.toml?ref=0de24d29d6195adecb6806103e205a202793cc0b",
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/open-source-software/mise.toml?ref=4a3679d9da910272ca4d741307e4cbbe2bde6d6e",
]

[tools]
"github:please-behave/cli" = "0.18.0"
python = "3.15.2"
"aqua:boyter/scc" = "4.1.0"
"aqua:lycheeverse/lychee" = "0.24.2"
"github:rust-lang/mdBook" = "0.5.4"

[tasks.format]
description = "Format the repository's shell scripts"
run = "shfmt -w scripts tests"

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.setup]
description = "Fetch dependencies for CI and offline Git hooks (the repository has none yet)"
run = "true"

[tasks.build]
description = "Build the documentation and check internal links"
run = "sh scripts/build.sh"

[tasks.test-links]
description = "Prove that broken internal links fail the documentation build"
run = "sh tests/broken-link.sh"
