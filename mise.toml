include = [
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/repository-conventions/mise.toml?ref=8d44e3ebb495ba1371e949bcc11b11597a632394",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/security/mise.toml?ref=8d44e3ebb495ba1371e949bcc11b11597a632394",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/open-source-software/mise.toml?ref=8d44e3ebb495ba1371e949bcc11b11597a632394",
]

[tools]
"github:please-behave/cli" = "0.20.0"
python = "3.15.2"
"aqua:boyter/scc" = "4.1.0"
"aqua:lycheeverse/lychee" = "0.24.2"
"github:rust-lang/mdBook" = "0.5.4"

[tasks.format]
description = "Format the repository's shell scripts"
run = "shfmt -w scripts tests"

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.setup]
description = "Fetch dependencies for CI and offline Git hooks (the repository has none yet)"
run = "true"

[tasks.build]
description = "Build the documentation and check internal links"
run = "sh scripts/build.sh"

[tasks.test-links]
description = "Prove that broken internal links fail the documentation build"
run = "sh tests/broken-link.sh"

[tasks.test-example]
description = "Test the Docker Compose example with cached images"
run = "sh tests/example-setup.sh"
