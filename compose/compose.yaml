name: please-behave-example

services:
  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: example-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ledger", "-d", "ledger"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [private]

  migrate:
    image: &ledger-image ghcr.io/please-behave/ledger:v0.6.0@sha256:7cb5c63abaff4ffb936098919e8ecdb118a3180fa94860dde41b3dc0e4a39b86
    command: ["migrate"]
    environment: &ledger-environment
      LEDGER_DATABASE_URL: postgresql://ledger:example-password@postgres:5432/ledger
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  ledger:
    image: *ledger-image
    environment: *ledger-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]

  gateway:
    image: ghcr.io/please-behave/gateway:v0.8.0@sha256:e0789edd1f38bcf56e0270d81031b9fa9d0f2c648380bb5e8d64da5a5a37d46b
    environment:
      GATEWAY_LEDGER_URL: http://ledger:8080
      GATEWAY_API_KEYS: example-ci:a46ef5f29b4b12ebe796f40df65647d444d859035d6bc8200828834c4d795e54
    depends_on:
      - ledger
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, private]

  cockpit:
    image: ghcr.io/please-behave/cockpit:v0.15.0@sha256:b09d1359d5aa6292b6dd908757ee9917d4de4393d10044b87c8f709bbaf3581c
    environment:
      COCKPIT_BIND_ADDR: 0.0.0.0:8080
      COCKPIT_LEDGER_URL: http://ledger:8080
      COCKPIT_GITHUB_CLIENT_ID: "${COCKPIT_GITHUB_CLIENT_ID:-exampleClientId}"
      COCKPIT_GITHUB_CLIENT_SECRET: "${COCKPIT_GITHUB_CLIENT_SECRET:-exampleClientSecret}"
      COCKPIT_GITHUB_CALLBACK_URL: "${COCKPIT_GITHUB_CALLBACK_URL:-https://cockpit.example.org/sign-in/callback}"
      COCKPIT_COOKIE_KEY: "${COCKPIT_COOKIE_KEY:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f202122232425262728292a2b2c2d2e2f303132333435363738393a3b3c3d3e3f}"
      COCKPIT_GITHUB_ALLOWED_IDS: "${COCKPIT_GITHUB_ALLOWED_IDS:-12345,67890}"
    depends_on:
      - ledger
    ports:
      - "127.0.0.1:8081:8080"
    networks: [default, private]

networks:
  private:
    internal: true

volumes:
  postgres-data:
